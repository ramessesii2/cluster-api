# Azure MachineDeployment Benchmark Cluster
# Uses individual Azure VMs managed by CAPI MachineSet
#
# Prerequisites:
#   - CAPZ installed on management cluster (clusterctl init --infrastructure azure)
#   - AzureClusterIdentity "cluster-identity" created in the md-bench-azure namespace
#     (see: https://capz.sigs.k8s.io/self-managed/getting-started#setting-up-the-cluster-identity)
#
# Before applying, export required env vars:
#   export AZURE_LOCATION=eastus
#   export AZURE_SUBSCRIPTION_ID=<your-subscription-id>
#   export AZURE_SSH_PUBLIC_KEY_B64=$(cat ~/.ssh/id_rsa.pub | base64 | tr -d '\n')
#   export BENCHMARK_START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
#   envsubst < azure/machinedeployment/cluster.yaml | kubectl apply -f -

---
apiVersion: v1
kind: Namespace
metadata:
  name: md-bench-azure
  labels:
    benchmark: machinepool-vs-md
    type: machinedeployment
    provider: azure
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: md-bench-azure
  namespace: md-bench-azure
  labels:
    benchmark: machinepool-vs-md
    type: machinedeployment
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: md-bench-azure-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: AzureCluster
    name: md-bench-azure
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureCluster
metadata:
  name: md-bench-azure
  namespace: md-bench-azure
spec:
  location: eastus
  subscriptionID: ${AZURE_SUBSCRIPTION_ID}
  resourceGroup: md-bench-azure-rg
  identityRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: AzureClusterIdentity
    name: cluster-identity
    namespace: md-bench-azure
  networkSpec:
    vnet:
      name: md-bench-azure-vnet
    subnets:
      - name: md-bench-azure-cp-subnet
        role: control-plane
      - name: md-bench-azure-node-subnet
        role: node
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: md-bench-azure-control-plane
  namespace: md-bench-azure
spec:
  replicas: 1
  version: v1.32.0
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: AzureMachineTemplate
        name: md-bench-azure-control-plane
  kubeadmConfigSpec:
    clusterConfiguration:
      controllerManager:
        extraArgs:
          - name: allocate-node-cidrs
            value: "false"
          - name: cloud-provider
            value: external
          - name: cluster-name
            value: md-bench-azure
      etcd:
        local:
          dataDir: /var/lib/etcddisk/etcd
          extraArgs:
            - name: quota-backend-bytes
              value: "8589934592"
    diskSetup:
      filesystems:
        - device: /dev/disk/azure/scsi1/lun0
          extraOpts:
            - -E
            - lazy_itable_init=1,lazy_journal_init=1
          filesystem: ext4
          label: etcd_disk
        - device: ephemeral0.1
          filesystem: ext4
          label: ephemeral0
          replaceFS: ntfs
      partitions:
        - device: /dev/disk/azure/scsi1/lun0
          layout: true
          overwrite: false
          tableType: gpt
    files:
      - contentFrom:
          secret:
            key: control-plane-azure.json
            name: md-bench-azure-control-plane-azure-json
        owner: root:root
        path: /etc/kubernetes/azure.json
        permissions: "0644"
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
        name: '{{ ds.meta_data["local_hostname"] }}'
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
        name: '{{ ds.meta_data["local_hostname"] }}'
    mounts:
      - - LABEL=etcd_disk
        - /var/lib/etcddisk
    verbosity: 10
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: md-bench-azure-control-plane
  namespace: md-bench-azure
spec:
  template:
    spec:
      vmSize: Standard_D2s_v3
      osDisk:
        osType: Linux
        diskSizeGB: 128
      dataDisks:
        - nameSuffix: etcddisk
          diskSizeGB: 256
          lun: 0
      sshPublicKey: ${AZURE_SSH_PUBLIC_KEY_B64}
---
# MachineDeployment using individual Azure VMs
# This creates 1:1 Machine objects managed by MachineSet
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: md-bench-azure-workers
  namespace: md-bench-azure
  labels:
    benchmark: machinepool-vs-md
    type: machinedeployment
  annotations:
    benchmark.capi.io/created-at: "${BENCHMARK_START_TIME}"
spec:
  clusterName: md-bench-azure
  replicas: 5  # override via: kubectl patch machinedeployment ... -p '{"spec":{"replicas":N}}'
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: md-bench-azure
      cluster.x-k8s.io/deployment-name: md-bench-azure-workers
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: md-bench-azure
        cluster.x-k8s.io/deployment-name: md-bench-azure-workers
    spec:
      clusterName: md-bench-azure
      version: v1.32.0
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: md-bench-azure-workers
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: AzureMachineTemplate
        name: md-bench-azure-workers
  rollout:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
---
# AzureMachineTemplate - Each replica becomes an individual Azure VM
# CAPI creates a Machine object for EACH node
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: md-bench-azure-workers
  namespace: md-bench-azure
spec:
  template:
    spec:
      vmSize: Standard_D2s_v3
      osDisk:
        osType: Linux
        diskSizeGB: 30
        managedDisk:
          storageAccountType: Premium_LRS
      sshPublicKey: ${AZURE_SSH_PUBLIC_KEY_B64}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: md-bench-azure-workers
  namespace: md-bench-azure
spec:
  template:
    spec:
      files:
        - contentFrom:
            secret:
              key: worker-node-azure.json
              name: md-bench-azure-workers-azure-json
          owner: root:root
          path: /etc/kubernetes/azure.json
          permissions: "0644"
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            - name: cloud-provider
              value: external
          name: '{{ ds.meta_data["local_hostname"] }}'


---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureClusterIdentity
metadata:
  labels:
    clusterctl.cluster.x-k8s.io/move-hierarchy: "true"
    benchmark: machinepool-vs-md
  name: cluster-identity
  namespace: md-bench-azure
spec:
  allowedNamespaces: {}
  type: ServicePrincipal
  tenantID: "6d498697-2abe-46df-ae3e-4e5b2e25f280"      # Replace or use envsubst
  clientID: "acf22266-57d3-4345-b509-1efeb7755c4e"       # Replace or use envsubst
  clientSecret:
    name: azure-credentials
    namespace: md-bench-azure